# 指標が何を測っているか (runvault の宣言．rs-runvault docs/metrics.ja.md)．
#
# 名前は `simulation/src/record.rs` と `simulation/src/main.rs` が書いているものと
# 一致していなければならない．動機名と相関対象名は `simulation/src/motives.rs` と
# `simulation/src/simulation.rs` の列挙表から取りうる直積をすべて展開している．
#
# `direction` は «どちらが良いか»．沈黙率・動機分布・相関・組織状態はいずれも
# 模型の記述量なので `none` とする．参照分布からの KL だけは適合度として小さいほど
# 良く，LLM cache-hit 率は実行品質として大きいほど良い．

# --- ステップごと (scope=run, step=t) -------------------------------------

[metrics."silence_rate"]
meaning   = "そのステップで沈黙を選んだ従業員の割合"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."motive_mix_ineffectual"]
meaning   = "沈黙者のうち無力感動機が占める割合"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."motive_mix_relational"]
meaning   = "沈黙者のうち関係維持動機が占める割合"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."motive_mix_defensive"]
meaning   = "沈黙者のうち防衛動機が占める割合"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."motive_mix_diffident"]
meaning   = "沈黙者のうち自信欠如動機が占める割合"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."motive_mix_disengaged"]
meaning   = "沈黙者のうち離脱動機が占める割合"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."motive_mix_deviant"]
meaning   = "沈黙者のうち逸脱的保留動機が占める割合"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."motive_vec_mean_ineffectual"]
meaning   = "全従業員が持つ無力感動機確率の平均"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."motive_vec_mean_relational"]
meaning   = "全従業員が持つ関係維持動機確率の平均"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."motive_vec_mean_defensive"]
meaning   = "全従業員が持つ防衛動機確率の平均"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."motive_vec_mean_diffident"]
meaning   = "全従業員が持つ自信欠如動機確率の平均"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."motive_vec_mean_disengaged"]
meaning   = "全従業員が持つ離脱動機確率の平均"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."motive_vec_mean_deviant"]
meaning   = "全従業員が持つ逸脱的保留動機確率の平均"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."n_distinct_motives_active"]
meaning   = "そのステップの沈黙者に現れた異なる主要沈黙動機の数"
unit      = "count"
direction = "none"
range     = [0.0, 6.0]
scope     = ["run"]

[metrics."climate_of_silence"]
meaning   = "組織全体で知覚された沈黙風土の平均"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."org_performance"]
meaning   = "発言による知識蓄積から計算した組織業績の代理値"
unit      = "score"
direction = "none"
scope     = ["run"]

[metrics."issue_salience"]
meaning   = "そのステップにおける組織課題の顕著性"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."kl_to_reference"]
meaning   = "そのステップの沈黙動機分布から Brinsfield 参照分布への KL ダイバージェンス"
unit      = "nats"
direction = "down"
scope     = ["run"]

