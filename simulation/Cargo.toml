[package]
name = "brinsfield-simulation"
version = "0.1.0"
edition = "2021"

[lib]
name = "brinsfield_silence_simulation"
path = "src/lib.rs"

[[bin]]
name = "brinsfield"
path = "src/main.rs"

[dependencies]
rand        = { version = "0.8", features = ["small_rng"] }
csv         = "1.3"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
clap        = { version = "4.5", features = ["derive"] }
chrono      = "0.4"

# social-simulation framework (socsim) — ABM のエンジン基盤．Brinsfield (2013)
# の 6 動機サイレンスモデルは Watts–Strogatz 小世界ネットワーク上の LLM 駆動エージェント
# と 6/4/3 次元動機別ロジスティック ablation を排他的に切替える．網モデル + LLM 駆動
# なので core + engine + net + llm を取り込む．具体的 commit は Cargo.lock で固定．
socsim-core    = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-core" }
socsim-engine  = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-engine" }
socsim-net     = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-net" }
socsim-llm     = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-llm", features = ["live"] }

# runvault — 実験記録基盤．run ディレクトリ・config.json・metrics.csv・events.jsonl・
# manifest を持つ．出力の置き場と同一性はこちらに預けるので，socsim-results
# (timestamp / latest symlink / CSV・JSON 書き出し) はもう使わない．
# git 依存．具体的な commit は Cargo.lock で固定される．
runvault = { git = "https://github.com/akitenkrad/rs-runvault", branch = "main" }
